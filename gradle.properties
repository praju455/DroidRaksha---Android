# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# ── Memory Allocation ────────────────────────────────────────────────────────
# Allocate 4GB heap and 1GB metaspace to prevent JVM GC thrashing during KSP, Hilt, and Compose compilation
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=100 -Dfile.encoding=UTF-8

# ── Build Optimizations ──────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.vfs.watch=true

# ── Android & Kotlin Optimizations ───────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
